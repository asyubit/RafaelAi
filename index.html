<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#02040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ラファエルAI</title>
<style>
:root{--pulse:.16;--mx:50%;--my:42%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#02040a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 28%,#153b5f 0,#071522 34%,#02040a 74%)}
.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
.brand{position:absolute;top:max(15px,env(safe-area-inset-top));z-index:10;font-size:11px;letter-spacing:.22em;color:#ddfaffaa}
.stage{width:min(94vw,480px);height:min(68dvh,650px);position:relative;display:grid;place-items:center;perspective:1300px}
.coreWrap{width:84%;aspect-ratio:1;position:relative;transform-style:preserve-3d;animation:living 7s ease-in-out infinite;filter:drop-shadow(0 30px 50px #000b)}
.core{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;transform:translateZ(60px);box-shadow:0 0 calc(24px + var(--pulse)*55px) #6ee9ff88}
.coreGlow{position:absolute;inset:-5%;border-radius:50%;transform:translateZ(20px);background:radial-gradient(circle at 50% 50%,transparent 42%,#6fe9ff22 62%,transparent 78%);filter:blur(10px);animation:pulseGlow 4.6s ease-in-out infinite;pointer-events:none}
.ring1,.ring2{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none}
.ring1{width:115%;aspect-ratio:1;transform:translate(-50%,-50%) translateZ(10px) rotateX(68deg);border:2px solid #b8f5ff88;box-shadow:0 0 28px #66e8ff99;animation:ringA 12s linear infinite}
.ring2{width:92%;aspect-ratio:1;transform:translate(-50%,-50%) translateZ(30px) rotateX(74deg) rotateY(24deg);border:1px solid #ffe5a888;box-shadow:0 0 18px #ffd98c66;animation:ringB 17s linear infinite reverse}
.shine{position:absolute;inset:-1%;border-radius:50%;transform:translateZ(95px);background:radial-gradient(circle at var(--mx) var(--my),#fff8 0 1.5%,#b9f8ff2b 10%,transparent 32%),linear-gradient(120deg,transparent 18%,#dafaff1f 48%,transparent 70%);mix-blend-mode:screen;pointer-events:none}
@keyframes living{
  0%,100%{transform:rotateX(-4deg) rotateY(-6deg) translateY(5px) scale(.985)}
  25%{transform:rotateX(2deg) rotateY(4deg) translateY(-2px) scale(1.005)}
  50%{transform:rotateX(4deg) rotateY(7deg) translateY(-8px) scale(1.018)}
  75%{transform:rotateX(-2deg) rotateY(-2deg) translateY(-2px) scale(1.004)}
}
@keyframes pulseGlow{0%,100%{opacity:.45;transform:translateZ(20px) scale(.97)}50%{opacity:.95;transform:translateZ(20px) scale(1.035)}}
@keyframes ringA{to{transform:translate(-50%,-50%) translateZ(10px) rotateX(68deg) rotateZ(360deg)}}
@keyframes ringB{to{transform:translate(-50%,-50%) translateZ(30px) rotateX(74deg) rotateY(24deg) rotateZ(360deg)}}
.hud{width:min(94vw,520px);padding:14px 15px 16px;border:1px solid #ffffff24;border-radius:24px;background:#07111be0;backdrop-filter:blur(18px);box-shadow:0 18px 55px #0009;text-align:center;z-index:4}
.status{font-size:22px;font-weight:800}.sub{min-height:42px;margin-top:6px;color:#cadde8;font-size:14px;line-height:1.45;display:flex;align-items:center;justify-content:center}
.btn{margin-top:10px;width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(180deg,#eefcff,#bceefa);color:#06202a;font-size:17px;font-weight:800;box-shadow:0 8px 24px #50dfff24}
.btn.active{background:linear-gradient(180deg,#fff2cc,#ffd78e)}
.small{margin-top:8px;font-size:11px;color:#91a7b6}
.speaking .coreWrap{animation-duration:2.4s}.speaking .core{box-shadow:0 0 85px #78ecffcc}.speaking .coreGlow{animation-duration:1.7s}
</style>
</head>
<body>
<div class="app" id="app">
<div class="brand">RAPHAEL · VOICE AI</div>
<div class="stage" id="stage">
  <div class="coreWrap">
    <img class="core" src="/raphael-core.png" alt="Raphael AI Core">
    <div class="coreGlow"></div>
    <div class="ring1"></div>
    <div class="ring2"></div>
    <div class="shine"></div>
  </div>
</div>
<section class="hud">
  <div class="status" id="status">待機中</div>
  <div class="sub" id="sub">「ラファエルさん」と呼びかけてください</div>
  <button class="btn" id="mic">マイクを開始</button>
  <div class="small">iPhoneではこの画面を開いている間に使用できます。</div>
</section>
</div>
<script>
const app=document.getElementById('app'),stage=document.getElementById('stage'),statusEl=document.getElementById('status'),sub=document.getElementById('sub'),mic=document.getElementById('mic'),root=document.documentElement;
let recognition=null,running=false,mode='wake',busy=false,recorder=null,chunks=[],stream=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function state(a,b,p=.16){statusEl.textContent=a;sub.textContent=b||'';root.style.setProperty('--pulse',p)}
function restart(){if(!recognition||busy)return;setTimeout(()=>{try{if(!running)recognition.start()}catch{}},650)}
async function api(payload){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||'接続エラー')}return r}
async function say(text,after){
 busy=true;app.classList.add('speaking');state('ラファエル',text,1);try{recognition?.stop()}catch{}
 try{const r=await api({action:'speak',text});const blob=await r.blob(),url=URL.createObjectURL(blob),audio=new Audio(url);audio.onended=()=>{URL.revokeObjectURL(url);busy=false;app.classList.remove('speaking');after?.();restart()};await audio.play()}
 catch{const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.88;u.pitch=1.04;u.onend=()=>{busy=false;app.classList.remove('speaking');after?.();restart()};speechSynthesis.cancel();speechSynthesis.speak(u)}
}
async function ask(q){mode='thinking';busy=true;state('思考中',q,.55);try{const r=await api({action:'ask',question:q}),d=await r.json();mode='wake';busy=false;await say(d.answer,()=>state('待機中','「ラファエルさん」と呼びかけてください',.16))}catch(e){mode='wake';busy=false;await say('不明、AIとの接続を確認してください。',()=>state('接続エラー',e.message,0))}}
function handleText(t){t=(t||'').trim();if(!t)return;sub.textContent=t;if(mode==='wake'){if(/ラファエル(さん)?/.test(t)){const q=t.replace(/^.*?ラファエル(さん)?[、,\s]*/,'').trim();if(q){ask(q)}else{mode='question';say('是、お呼びでしょうか。ご質問をどうぞ。',()=>state('質問をどうぞ','聞いています…',.7))}}}else if(mode==='question'){ask(t)}}
function setupSR(){if(!SR)return false;recognition=new SR();recognition.lang='ja-JP';recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>{running=true;mic.textContent='聞いています';mic.classList.add('active')};recognition.onend=()=>{running=false;mic.classList.remove('active');if(!busy)restart()};recognition.onerror=e=>{if(!['no-speech','aborted'].includes(e.error))state('マイク確認',e.error,.1)};recognition.onresult=e=>{const r=e.results[e.results.length-1],t=r[0].transcript.trim();sub.textContent=t;if(r.isFinal&&!busy)handleText(t)};return true}
async function blobToBase64(blob){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result.split(',')[1]);fr.onerror=reject;fr.readAsDataURL(blob)})}
async function startRecord(){if(busy)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});stream?.getTracks().forEach(t=>t.stop());state('文字起こし中','少しお待ちください',.4);try{const b64=await blobToBase64(blob),r=await api({action:'transcribe',audio:b64,mime:blob.type}),d=await r.json();handleText(d.text)}catch(e){state('マイクエラー',e.message,.1)}};recorder.start();mic.textContent='話し終えたらタップ';mic.classList.add('active');state('聞いています','話してください',.65)}catch(e){state('マイクエラー','マイクの許可を確認してください',.1)}}
function stopRecord(){if(recorder&&recorder.state==='recording'){recorder.stop();mic.textContent='マイクを開始';mic.classList.remove('active')}}
const hasSR=setupSR();if(!hasSR){state('タップして会話','iPhoneではボタンを押して話してください',.18);mic.textContent='話す'}
mic.onclick=()=>{if(hasSR){try{recognition.start();state('待機中','「ラファエルさん」と呼びかけてください',.2)}catch{}}else{if(recorder&&recorder.state==='recording')stopRecord();else startRecord()}};
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;root.style.setProperty('--mx',(x*100)+'%');root.style.setProperty('--my',(y*100)+'%')});
</script>
</body>
</html>
